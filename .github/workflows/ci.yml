name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests read a .env.local via `node --env-file`. They use in-memory
      # fakes (no real DB), so schema-valid placeholder values are enough for
      # env.ts to parse. AUTH_SECRET must differ from TOKEN_SECRET.
      - name: Create test env
        run: |
          cat > .env.local <<'EOF'
          DATABASE_URL=postgres://qcg_app:pw@localhost:5433/qcg
          MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5433/qcg
          AUTH_SECRET=ci-only-auth-secret-value-1234567890
          TOKEN_SECRET=ci-only-token-secret-value-1234567890
          APP_BASE_URL=http://localhost:3000
          STORAGE_DRIVER=local
          EOF

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit
