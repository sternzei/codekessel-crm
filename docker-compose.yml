# Services:
#   db     — Postgres 16 (always started; host port 5433 matches
#            MIGRATION_DATABASE_URL in .env.example, so it also unblocks local dev).
#   web    — the Next.js app (runs migrations, then serves).   [profile: app]
#   worker — the reminder/escalation loop.                      [profile: app]
#
# `docker compose up -d` starts ONLY db (keeps `pnpm db:reset` fast).
# `docker compose --profile app up -d --build` starts the full prod-like stack.
services:
  db:
    image: postgres:16-alpine
    container_name: qcg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qcg
    ports:
      # 5433 on the host: many dev machines run a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - qcg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qcg"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: qcg/sales-automation:local
    container_name: qcg-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Containers reach the db service on the internal network port 5432.
      DATABASE_URL: ${DATABASE_URL:-postgres://qcg_app:qcg_app_dev_pw@db:5432/qcg}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://postgres:postgres@db:5432/qcg}
      # Override in real prod: openssl rand -base64 32 (must differ, ≥32 chars).
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-auth-secret-32chars-min}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-compose-token-secret-32chars-min}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # Documents live in Postgres, so the app tier holds no state and the
      # database backup is the whole backup. Set STORAGE_DRIVER=s3 + S3_* when
      # the document volume outgrows a dump (see docs/PRODUCTION-READINESS.md).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-db}
      # Marks this as the single-VM deployment: permits the localhost APP_BASE_URL.
      ALLOW_LOCAL_STORAGE_IN_PROD: ${ALLOW_LOCAL_STORAGE_IN_PROD:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # Sign in with Google. Unset, the button is hidden and /auth/google/*
      # redirects to the password form. A new Google account always lands in the
      # approval queue under /users before it can do anything.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Only needed with more than one tenant in the same database.
      REGISTRATION_TENANT_ID: ${REGISTRATION_TENANT_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      # Required in production: /impressum and /datenschutz are public pages
      # participants are pointed at before they hand over IBAN + signature.
      LEGAL_PROVIDER_NAME: ${LEGAL_PROVIDER_NAME:-QCG Demo GmbH}
      LEGAL_PROVIDER_ADDRESS: ${LEGAL_PROVIDER_ADDRESS:-Musterstraße 1\n80331 München}
      LEGAL_PROVIDER_EMAIL: ${LEGAL_PROVIDER_EMAIL:-datenschutz@example.com}
      LEGAL_PROVIDER_PHONE: ${LEGAL_PROVIDER_PHONE:-}
      LEGAL_PROVIDER_REPRESENTATIVE: ${LEGAL_PROVIDER_REPRESENTATIVE:-}
      LEGAL_REGISTER_ENTRY: ${LEGAL_REGISTER_ENTRY:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_SUPERVISORY_AUTHORITY: ${LEGAL_SUPERVISORY_AUTHORITY:-}
      LEGAL_PRIVACY_CONTACT: ${LEGAL_PRIVACY_CONTACT:-}
      # Provider of the aptitude test. Unset, the invite action refuses to send
      # rather than mailing participants a placeholder link.
      APTITUDE_TEST_BASE_URL: ${APTITUDE_TEST_BASE_URL:-}
      # Name + city printed on the generated BA paperwork.
      PROVIDER_NAME: ${PROVIDER_NAME:-}
      PROVIDER_CITY: ${PROVIDER_CITY:-}
    volumes:
      - qcg-uploads:/app/var
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Apply migrations (owner role) before serving the RLS-scoped app.
    command: sh -c "node_modules/.bin/drizzle-kit migrate && node server.js"

  worker:
    profiles: ["app"]
    image: qcg/sales-automation:local
    container_name: qcg-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Ensures the shared image is built and migrations have run first.
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://qcg_app:qcg_app_dev_pw@db:5432/qcg}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://postgres:postgres@db:5432/qcg}
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-auth-secret-32chars-min}
      TOKEN_SECRET: ${TOKEN_SECRET:-local-compose-token-secret-32chars-min}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-db}
      ALLOW_LOCAL_STORAGE_IN_PROD: ${ALLOW_LOCAL_STORAGE_IN_PROD:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}
      # Required in production: /impressum and /datenschutz are public pages
      # participants are pointed at before they hand over IBAN + signature.
      LEGAL_PROVIDER_NAME: ${LEGAL_PROVIDER_NAME:-QCG Demo GmbH}
      LEGAL_PROVIDER_ADDRESS: ${LEGAL_PROVIDER_ADDRESS:-Musterstraße 1\n80331 München}
      LEGAL_PROVIDER_EMAIL: ${LEGAL_PROVIDER_EMAIL:-datenschutz@example.com}
      LEGAL_PROVIDER_PHONE: ${LEGAL_PROVIDER_PHONE:-}
      LEGAL_PROVIDER_REPRESENTATIVE: ${LEGAL_PROVIDER_REPRESENTATIVE:-}
      LEGAL_REGISTER_ENTRY: ${LEGAL_REGISTER_ENTRY:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_SUPERVISORY_AUTHORITY: ${LEGAL_SUPERVISORY_AUTHORITY:-}
      LEGAL_PRIVACY_CONTACT: ${LEGAL_PRIVACY_CONTACT:-}
      APTITUDE_TEST_BASE_URL: ${APTITUDE_TEST_BASE_URL:-}
      PROVIDER_NAME: ${PROVIDER_NAME:-}
      PROVIDER_CITY: ${PROVIDER_CITY:-}
    volumes:
      # Nothing is written here under STORAGE_DRIVER=db; kept mounted so an
      # upgraded deployment can still run scripts/migrate-storage-to-db.ts over
      # the files an earlier local-driver install left behind.
      - qcg-uploads:/app/var
    command: node dist/worker.mjs --loop

volumes:
  qcg-pgdata:
  qcg-uploads:
