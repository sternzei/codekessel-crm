services:
  db:
    image: postgres:16-alpine
    container_name: qcg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qcg
    ports:
      # 5433 on the host: many dev machines run a native Postgres on 5432.
      - "5433:5432"
    volumes:
      - qcg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qcg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qcg-pgdata:
